<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1c">
<title>Gallery</title>
<style>
@font-face{
  font-family:'VIP';
  src:url('https://itsmems97.github.io/VIP.ttf') format('truetype');
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg1:#0b0d1c;--bg2:#1a1240;--text:#fff;--muted:rgba(255,255,255,.66);
  --glass:rgba(255,255,255,.12);--glass-b:rgba(255,255,255,.24);--hi:rgba(255,255,255,.38);
  --shadow:0 24px 60px rgba(0,0,0,.45);--blue:#0a84ff;--cyan:#64d2ff;--ok:#30d158;
  --o1:#5e5ce6;--o2:#ff375f;--o3:#0a84ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)
}
@media (prefers-color-scheme:light){:root{
  --bg1:#eef1ff;--bg2:#f8e9ff;--text:#14142b;--muted:rgba(20,20,43,.62);
  --glass:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.9);--hi:rgba(255,255,255,1);
  --shadow:0 24px 60px rgba(70,60,140,.25);--o1:#a5a3ff;--o2:#ffb3c6;--o3:#9fd0ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'VIP',-apple-system,"SF Pro Rounded","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;pointer-events:none;z-index:0}
.orb.a{width:62vmax;height:62vmax;background:var(--o1);top:-22vmax;left:-18vmax;animation:drift 18s ease-in-out infinite alternate}
.orb.b{width:54vmax;height:54vmax;background:var(--o2);bottom:-20vmax;right:-16vmax;opacity:.5;animation:drift 22s ease-in-out infinite alternate-reverse}
.orb.c{width:40vmax;height:40vmax;background:var(--o3);top:30%;left:35%;opacity:.4;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.12)}}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.06),var(--shadow);
  -webkit-backdrop-filter:blur(28px) saturate(185%);backdrop-filter:blur(28px) saturate(185%)}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px calc((100vw - var(--cw))/2);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail{--cw:min(76vw,340px)}
.card{flex:0 0 var(--cw);aspect-ratio:4/5;border-radius:36px;overflow:hidden;scroll-snap-align:center;position:relative;
  transform:scale(.88);opacity:.62;transition:transform .55s cubic-bezier(.2,.9,.25,1.1),opacity .4s,box-shadow .4s;
  animation:rise .9s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*90ms);background:var(--glass)}
.card.on{transform:scale(1);opacity:1}
.card img, .card video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.18);
  background:linear-gradient(155deg,rgba(255,255,255,.22),transparent 38%)}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.8)}}
.skel{background:linear-gradient(100deg,var(--glass) 30%,rgba(255,255,255,.28) 50%,var(--glass) 70%);background-size:220% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
.dots{display:flex;justify-content:center;gap:7px;margin:0 auto;padding:9px 13px;border-radius:99px;width:max-content;max-width:90vw}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;transition:all .35s;cursor:pointer}
.dots i.on{width:22px;border-radius:5px;background:var(--text);opacity:1}
.msg{text-align:center;color:var(--muted);padding:0 30px;font-size:16px;line-height:1.5}
footer{position:relative;z-index:1;display:flex;justify-content:center;padding:14px 20px calc(26px + env(safe-area-inset-bottom,0px))}
.add{position:relative;display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 34px;border-radius:99px;border:0;color:var(--text);
  font-weight:600;font-size:17px;font-family:inherit;cursor:pointer;overflow:hidden;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.add::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-120%);animation:glint 4.5s ease-in-out infinite}
@keyframes glint{55%,100%{transform:translateX(120%)}}
.add:active{transform:scale(.94)}.add:disabled{opacity:.5}
.add svg{width:22px;height:22px}
/* send animation */
.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s}
.layer.show{opacity:1;pointer-events:auto}
#send{background:rgba(5,6,18,.45);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);flex-direction:column}
.stage{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:50%;width:120px;height:120px;margin:-60px;border-radius:50%;border:2px solid var(--cyan);opacity:0}
.show .ring{animation:pulse 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.ring:nth-child(2){animation-delay:.6s!important}.ring:nth-child(3){animation-delay:1.2s!important}
@keyframes pulse{0%{transform:scale(.8);opacity:.85}100%{transform:scale(2.3);opacity:0}}
.av{position:relative;width:118px;height:118px;border-radius:50%;background:center/cover;box-shadow:0 0 0 4px rgba(255,255,255,.2),0 14px 40px rgba(10,132,255,.5);transform:scale(.6);transition:transform .6s cubic-bezier(.2,1.5,.4,1)}
.show .av{transform:scale(1)}
.prog{position:absolute;width:150px;height:150px;transform:rotate(-90deg)}
.prog circle{fill:none;stroke-width:5;stroke-linecap:round}
.prog .t{stroke:rgba(255,255,255,.18)}
.prog .f{stroke:url(#g);stroke-dasharray:440;stroke-dashoffset:440}
.sending .prog .f{animation:fill 2.3s cubic-bezier(.45,.1,.3,1) forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.tick{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;transform:scale(0);box-shadow:0 10px 30px rgba(48,209,88,.55)}
.done .tick{animation:pop .55s cubic-bezier(.2,1.8,.4,1) forwards}
.done .av{filter:brightness(.5)}
@keyframes pop{to{transform:scale(1)}}
.tick svg{width:34px;height:34px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.done .tick svg{animation:draw .4s .25s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.status{margin-top:26px;font-size:21px;font-weight:600;color:#fff;letter-spacing:.2px;transition:opacity .25s}
.sub{margin-top:6px;font-size:15px;color:rgba(255,255,255,.68)}
/* popup */
#pop{background:rgba(5,6,18,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:24px}
.sheet{width:min(340px,100%);border-radius:40px;padding:34px 24px 22px;text-align:center;transform:translateY(40px) scale(.82);opacity:0;
  transition:transform .65s cubic-bezier(.2,1.45,.35,1),opacity .35s}
.layer.show .sheet{transform:none;opacity:1}
.badge{width:78px;height:78px;margin:0 auto 20px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--blue),#bf5af2);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 16px 36px rgba(94,92,230,.55);animation:float 3.2s ease-in-out infinite}
.badge svg{width:40px;height:40px;fill:#fff}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.sheet h2{margin:0 0 8px;font-size:25px;line-height:1.2;font-weight:700}
.sheet p{margin:0 0 24px;color:var(--muted);font-size:16px;line-height:1.45}
.ok{width:100%;height:54px;border:0;border-radius:99px;font-weight:600;font-size:18px;font-family:inherit;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#3d9bff,var(--blue));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 10px 26px rgba(10,132,255,.5);transition:transform .2s}
.ok:active{transform:scale(.96)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:30;padding:13px 20px;border-radius:99px;font-size:15px;transition:all .4s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.brand{font-family:'VIP',inherit;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;
  margin:0;padding:8px 16px 12px;font-size:18px;font-weight:800;line-height:1.2;letter-spacing:.2px;
  animation:floaty 3.6s ease-in-out infinite}
.brand .txt{background:linear-gradient(100deg,var(--text) 15%,var(--cyan) 38%,#bf5af2 52%,var(--text) 78%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;animation:sheen 5.5s linear infinite}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-130% 0}}
@keyframes floaty{50%{transform:translateY(-4px)}}
.spark{font-size:13px;color:var(--cyan);opacity:.85;animation:twinkle 2.4s ease-in-out infinite}
.brand .s2{animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(90deg)}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.top{position:relative;z-index:2;padding-top:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}.chips[hidden]{display:none}
.chip{flex:none;border-radius:99px;padding:10px 18px;font-weight:600;font-size:15px;font-family:inherit;color:var(--text);cursor:pointer;background:var(--glass);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .25s cubic-bezier(.2,1.6,.4,1),background .3s,color .3s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--text);color:var(--bg1);animation:pop2 .45s cubic-bezier(.2,1.8,.4,1)}
#fols .chip{padding:8px 14px;font-size:13.5px;font-weight:500}
@keyframes pop2{40%{transform:scale(1.12)}}
footer{gap:12px;align-items:center}
.plus{width:58px;height:58px;border-radius:50%;border:0;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
.plus svg{width:26px;height:26px;transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.plus:active{transform:scale(.88)}.plus.open svg{transform:rotate(135deg)}
.plus.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.upl .prog .f{transition:stroke-dashoffset .3s linear}
#menu,#dlg,#confirmPop{align-items:flex-end;background:rgba(5,6,18,.38);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#dlg{align-items:flex-start;padding-top:12vh}
#confirmPop{align-items:center}
.sheet.sm{width:min(420px,100%);padding:12px;border-radius:34px;text-align:left}
.sheet.sm h3{margin:8px 8px 12px;font-size:20px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:24px;background:none;color:var(--text);font-weight:600;font-size:17px;font-family:inherit;cursor:pointer;transition:background .2s,transform .2s}
.mi:active{background:rgba(255,255,255,.18);transform:scale(.97)}
.mi b{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--blue),#bf5af2);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5)}
.mi svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.in{width:100%;height:52px;border-radius:18px;border:1px solid var(--glass-b);background:rgba(255,255,255,.1);color:var(--text);font-weight:500;font-size:17px;font-family:inherit;padding:0 16px;outline:none;transition:box-shadow .25s;-webkit-user-select:text;user-select:text}
.in:focus{box-shadow:0 0 0 3px rgba(10,132,255,.55)}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;height:50px;border:0;border-radius:99px;font-weight:600;font-size:17px;font-family:inherit;cursor:pointer;color:var(--text);background:var(--glass);box-shadow:inset 0 1px 0 var(--hi);transition:transform .2s}
.btns button:active{transform:scale(.95)}
.btns .go{background:linear-gradient(180deg,#3d9bff,var(--blue));color:#fff}
.btns .del{background:linear-gradient(180deg,#ff375f,var(--o2));color:#fff}
.shake{animation:shk .45s}@keyframes shk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

/* Selection & Action Bar */
.card.selected { transform: scale(.95); border: 3px solid var(--blue); box-shadow: 0 0 20px var(--blue); opacity: 1; }
#action-bar { position: fixed; bottom: -100px; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; justify-content: space-around; padding: 16px; border-top: 1px solid var(--glass-b); transition: bottom 0.3s cubic-bezier(0.2, 1, 0.4, 1); z-index: 50; }
#action-bar.show { bottom: 0; }
.act-btn { background: none; border: none; color: var(--text); font-family: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; }
.act-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
.act-btn.danger { color: var(--o2); }
.share-in { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--glass-b); background: rgba(255,255,255,0.1); color: var(--text); padding: 0 16px; font-family: inherit; font-size: 16px; margin-bottom: 12px; outline: none; }

#lock{position:fixed;inset:0;z-index:100;background:var(--bg1);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;transition:opacity .4s}
#lock.hide{opacity:0;pointer-events:none}
.lock-box{width:100%;max-width:340px;text-align:center;padding:34px 24px;border-radius:34px}
.lock-box h2{margin:0 0 20px;font-size:24px;font-weight:700}
.emoji-anim{font-size:38px;height:48px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;transition:all .3s}
.anim-waiting{animation:waitEars 2s ease-in-out infinite}
.anim-typing{animation:typeEyes .6s ease-in-out infinite alternate}
.anim-success{animation:popParty .6s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes waitEars{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.05) rotate(-5deg)}75%{transform:scale(1.05) rotate(5deg)}}
@keyframes typeEyes{0%{transform:scale(1)}100%{transform:scale(1.15) translateY(-3px)}}
@keyframes popParty{0%{transform:scale(0) rotate(-20deg);opacity:0}50%{transform:scale(1.4) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.lock-group{position:relative;width:100%;margin-bottom:16px;display:flex;align-items:center}
.lock-in{width:100%;height:58px;border-radius:18px;border:1px solid var(--glass-b);background:var(--glass);color:var(--text);font-size:20px;text-align:center;outline:none;font-family:inherit;padding:0 48px}
.lock-in:focus{box-shadow:0 0 0 3px var(--blue)}
.eye-btn{position:absolute;right:12px;background:none;border:0;padding:8px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;opacity:.6;transition:opacity .2s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.eye-btn:active{opacity:1;transform:scale(.9)}
.eye-btn svg{width:24px;height:24px}
.lock-btn{width:100%;height:58px;border-radius:18px;border:0;background:linear-gradient(180deg,#3d9bff,var(--blue));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px rgba(10,132,255,.3);color:#fff;font-size:18px;font-weight:600;cursor:pointer;transition:transform .2s}
.lock-btn:active{transform:scale(.96)}
.lock-err{color:var(--o2);font-size:14px;margin-top:12px;height:20px;font-weight:600;opacity:0;transition:opacity .2s}
.lock-err.show{opacity:1}
</style>
</head>
<body>
<div id="lock">
  <div class="lock-box glass">
    <h2>Enter Password</h2>
    <div class="emoji-anim anim-waiting" id="emojiAnim">🙉</div>
    <div class="lock-group">
      <input type="password" id="passIn" class="lock-in" placeholder="Enter code" autocomplete="off">
      <button class="eye-btn" id="eyeBtn" aria-label="Show password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      </button>
    </div>
    <button id="passBtn" class="lock-btn">Unlock</button>
    <div class="lock-err" id="passErr">Wrong password</div>
  </div>
</div>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<header class="top">
  <h1 class="brand"><span class="spark">✦</span><span class="txt">Syed Zulqarnain Repository</span><span class="spark s2">✦</span></h1>
  <div class="chips" id="cats"></div><div class="chips" id="fols" hidden></div>
</header>

<main>
  <div class="rail" id="rail" aria-label="Pictures"></div>
  <div class="dots glass" id="dots" hidden></div>
  <p class="msg" id="msg"></p>
</main>

<footer>
  <button class="add glass tap" id="add" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M12 8.5v6m-3-3h6"/></svg>
    Add to iPhone
  </button>
  <button class="plus glass tap" id="plus" aria-label="Create or upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</footer>

<!-- Multi Selection Action Bar -->
<div id="action-bar">
  <button class="act-btn danger" onclick="deleteSelected()"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Delete</button>
  <button class="act-btn" onclick="shareSelected()"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>Share</button>
  <button class="act-btn" onclick="cancelSelection()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>Cancel</button>
</div>

<!-- Custom Delete Confirm Popup -->
<div class="layer" id="confirmPop" role="dialog" aria-modal="true">
  <div class="sheet glass">
    <h2 style="margin-top:0;" id="confirmTitle">Delete</h2>
    <p style="font-size:14px; margin-bottom:16px;" id="confirmMsg">Are you sure?</p>
    <button class="ok tap" id="confirmYes" style="background:linear-gradient(180deg,#ff375f,var(--o2)); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5), 0 10px 26px rgba(255,55,95,.5); margin-bottom:10px;">Delete</button>
    <button class="ok tap" style="background:var(--glass); color:var(--text);" onclick="document.getElementById('confirmPop').classList.remove('show')">Cancel</button>
  </div>
</div>

<!-- Share Popup -->
<div class="layer" id="sharePop" role="dialog" aria-modal="true">
  <div class="sheet glass">
    <h2 style="margin-top:0;">Share Link</h2>
    <p style="font-size:14px; margin-bottom:16px;">Set a custom password for this link or leave it empty for none.</p>
    <input class="share-in" id="sharePassIn" placeholder="Password (Optional)" autocomplete="off">
    <button class="ok tap" id="shareBtn" style="margin-bottom:10px;">Generate Link</button>
    <button class="ok tap" style="background:var(--glass); color:var(--text);" onclick="document.getElementById('sharePop').classList.remove('show')">Cancel</button>
  </div>
</div>

<div class="layer" id="send" role="status" aria-live="polite">
  <div class="stage" id="stage">

<script>
const OWNER='itsmems97',REPO='Personal-Data',DIR='MuhammadShah',BRANCH='main';
const GW='https://pikamovie-api.duckdns.org/gallery';
const TREE='https://pikamovie-api.duckdns.org/gallery/list?';
const RAW='https://pikamovie-api.duckdns.org/gallery/storage/';
const CDN='https://pikamovie-api.duckdns.org/gallery/storage/';
const IMG=/\.(jpe?g|png|webp|gif|avif|heic|heif|mp4|mov|webm|m4v)$/i;
const $=id=>document.getElementById(id);
const rail=$('rail'),dots=$('dots'),msg=$('msg'),add=$('add'),plus=$('plus'),menu=$('menu');
let data={root:[],cats:{}},cat='Main',fol='',items=[],active=0,busy=false,io=null,cfg={needCode:false};
let selectedPaths = new Set();
let isSelectMode = false;
const blobs=new Map(),wait=ms=>new Promise(r=>setTimeout(r,ms)),enc=encodeURIComponent,nice=n=>n.replace(/-/g,' ');

document.addEventListener('pointerdown',e=>{const t=e.target.closest('.tap');if(!t)return;
  const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,p=document.createElement('span');
  p.className='rip';p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  t.appendChild(p);setTimeout(()=>p.remove(),650)});

function skeletons(){rail.innerHTML='';for(let i=0;i<3;i++){const d=document.createElement('div');d.className='card skel'+(i===0?' on':'');d.style.setProperty('--i',i);rail.appendChild(d)}}

function parse(tree){
  const d={root:[],cats:{}};
  tree.forEach(n=>{
    if(n.type!=='blob'||n.path.indexOf(DIR+'/')!==0)return;
    const relPath = n.path.slice(DIR.length+1);
    const parts=relPath.split('/'),file=parts[parts.length-1];
    
    const isImg = IMG.test(file);
    if(!isImg && file !== '.gitkeep') return;

    const fullUrlPath=n.path.split('/').map(enc).join('/');
    const it = isImg ? {name:file,url:CDN+fullUrlPath,fallback:RAW+fullUrlPath, path: relPath} : null;

    if(parts.length===1){ if(it) d.root.push(it); return }
    const c=d.cats[parts[0]]||(d.cats[parts[0]]={files:[],folders:{}});
    if(parts.length===2){ if(it) c.files.push(it); return }
    const f=c.folders[parts[1]]||(c.folders[parts[1]]=[]);
    if(it) f.push(it);
  });
  return d;
}
function pick(){
  const c=data.cats[cat];let l=[];
  if(!cat)l=data.root;else if(c){l=!fol?c.files.concat(...Object.values(c.folders)):(c.folders[fol]||[])}
  items=l.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
}

// Custom Confirm Logic
let confirmCallback = null;
function showConfirm(title, msg, cb) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmPop').classList.add('show');
    confirmCallback = cb;
}
document.getElementById('confirmYes').onclick = () => {
    document.getElementById('confirmPop').classList.remove('show');
    if(confirmCallback) confirmCallback();
};

function chip(label,on,fn,delPath){
  const b=document.createElement('button');b.className='chip tap'+(on?' on':'');b.textContent=label;
  let pressTimer;
  if(delPath){
    b.onmousedown = b.ontouchstart = (e) => {
      pressTimer = setTimeout(() => {
        showConfirm('Delete', 'Are you sure you want to delete ' + label + '?', () => {
            deleteSinglePath(delPath);
        });
      }, 800);
    };
    b.onmouseup = b.ontouchend = b.onmouseleave = b.ontouchmove = () => clearTimeout(pressTimer);
  }
  b.onclick=fn;return b;
}
function drawChips(){
  const cs=$('cats'),fs=$('fols');cs.innerHTML='';fs.innerHTML='';
  cs.appendChild(chip('Main',cat===''||cat==='Main',()=>go('Main',''), null));
  Object.keys(data.cats).sort().forEach(n=>{
    if(n!=='Main') cs.appendChild(chip(nice(n),cat===n,()=>go(n,''), n));
  });
  if(cat&&data.cats[cat]){
    fs.hidden=false;
    fs.appendChild(chip('All',fol==='',()=>go(cat,''), null));
    Object.keys(data.cats[cat].folders).sort().forEach(n=>{
      fs.appendChild(chip(nice(n),fol===n,()=>go(cat,n), cat+'/'+n));
    });
  }
  else fs.hidden=true;
}
function go(c,f){cat=c;fol=f;pick();drawChips();render()}

function render(){
  if(io)io.disconnect();rail.innerHTML='';dots.innerHTML='';
  if(!items.length){dots.hidden=true;add.disabled=true;msg.textContent='No pictures here yet. Tap + to upload one.';return}
  msg.textContent='';
  items.forEach((it,i)=>{
    const c=document.createElement('div');c.className='card glass'+(i===0?' on':'');c.style.setProperty('--i',i);
    
    let mediaEl;
    if(/\.(mp4|mov|webm|m4v)$/i.test(it.name)){
        mediaEl = document.createElement('video');
        mediaEl.src = it.url; mediaEl.muted = true; mediaEl.playsInline = true;
        mediaEl.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
    } else {
        mediaEl = new Image();
        mediaEl.src = it.url;
        mediaEl.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
        mediaEl.onerror = () => {
            if(!mediaEl.dataset.r){mediaEl.dataset.r=1;mediaEl.src=it.fallback;return}
            if(!mediaEl.dataset.f){mediaEl.dataset.f=1;setTimeout(()=>{mediaEl.src=it.fallback+'?r='+Date.now()},2500)}
        };
    }
    
    c.appendChild(mediaEl);

    // Long press selection logic FIXED
    let pressTimer;
    let isLongPress = false;
    
    c.onmousedown = c.ontouchstart = (e) => {
        isLongPress = false;
        pressTimer = setTimeout(() => {
            isLongPress = true;
            isSelectMode = true;
            c.classList.add('selected');
            selectedPaths.add(it.path);
            document.getElementById('action-bar').classList.add('show');
            if(navigator.vibrate) navigator.vibrate(50); // Haptic feedback
        }, 600); // 0.6 seconds long press
    };
    
    c.onmouseup = c.ontouchend = c.onmouseleave = c.ontouchmove = () => {
        clearTimeout(pressTimer);
    };
    
    c.onclick = (e) => {
        if (isLongPress) {
            e.preventDefault();
            e.stopPropagation();
            return; // Ignore click after long press
        }
        if (isSelectMode) {
            if (selectedPaths.has(it.path)) {
                selectedPaths.delete(it.path);
                c.classList.remove('selected');
            } else {
                selectedPaths.add(it.path);
                c.classList.add('selected');
            }
            if (selectedPaths.size === 0) cancelSelection();
        } else {
            c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
        }
    };

    rail.appendChild(c);
    const d=document.createElement('i');d.onclick=()=>c.click();dots.appendChild(d);
  });
  rail.scrollLeft=0;dots.hidden=items.length<2;add.disabled=false;setActive(0);
  if(typeof IntersectionObserver!=='undefined'){
    io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setActive([...rail.children].indexOf(e.target))}),{root:rail,threshold:.6});
    [...rail.children].forEach(c=>io.observe(c));
  }else{
    rail.onscroll=()=>{
      const cw=rail.children[0]?.getBoundingClientRect().width||1;
      const idx=Math.round(rail.scrollLeft/cw);
      setActive(Math.max(0,Math.min(items.length-1,idx)));
    };
  }
}
function setActive(i){
  if(i<0)return;active=i;
  [...rail.children].forEach((c,k)=>c.classList.toggle('on',k===i));
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  const it=items[i];if(it&&!blobs.has(it.url))blobs.set(it.url,fetchBlob(it.url));
}
async function load(first){
  if(first)skeletons();
  try{
    const r=await fetch(TREE+'&t='+Date.now());if(!r.ok)throw 0;
    data=parse((await r.json()).tree||[]);
    if(!cat) cat='Main';
    if(cat&&!data.cats[cat]){cat='Main';fol=''}
    if(fol&&!data.cats[cat].folders[fol])fol='';
    go(cat,fol);
  }catch(e){rail.innerHTML='';dots.hidden=true;msg.innerHTML='Couldn’t load the pictures.<br>Check your connection and refresh.'}
}
function fetchBlob(u){const p=fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()});p.catch(()=>blobs.delete(u));return p}
function save(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u; a.download=name; a.rel='noopener'; a.target='_blank';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),15000);
  setTimeout(()=>{ if(!document.hidden){ window.open(u,'_blank'); } },1200);
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3800)}

/* Add to iPhone */
add.onclick=async()=>{
  if(busy||!items.length)return;busy=true;add.disabled=true;
  const it=items[active],send=$('send'),stage=$('stage');
  $('av').style.backgroundImage='url("'+it.url+'")';
  stage.className='stage';$('status').textContent='Connecting…';$('sub').textContent='Looking for your iPhone';
  send.classList.add('show');
  if(navigator.vibrate)navigator.vibrate(12);
  let failed=false;
  if(!blobs.has(it.url))blobs.set(it.url,fetchBlob(it.url));
  const bp=blobs.get(it.url);
  await wait(900);
  stage.classList.add('sending');$('status').textContent='Sending…';$('sub').textContent='Hold on, almost there';
  bp.then(b=>save(b,it.name)).catch(()=>{failed=true});
  await wait(2400);
  if(failed){send.classList.remove('show');toast('Couldn’t download. Check your connection and try again.');busy=false;add.disabled=false;return}
  stage.classList.remove('sending');stage.classList.add('done');
  $('status').textContent='Sent';$('sub').textContent='Saved to your iPhone';
  if(navigator.vibrate)navigator.vibrate([18,40,18]);
  await wait(1300);
  send.classList.remove('show');await wait(250);
  $('pop').classList.add('show');$('ok').focus({preventScroll:true});
};
$('ok').onclick=()=>{$('pop').classList.remove('show');busy=false;add.disabled=!items.length};

/* small input dialog */
function ask(title,ph,okText,type){return new Promise(res=>{
  const d=$('dlg'),i=$('dIn'),ok=$('dOk'),no=$('dNo');
  $('dT').textContent=title;i.placeholder=ph;i.type=type||'text';i.value='';ok.textContent=okText;
  d.classList.add('show');setTimeout(()=>i.focus(),380);
  const close=v=>{d.classList.remove('show');ok.onclick=no.onclick=i.onkeydown=null;i.blur();res(v)};
  ok.onclick=()=>{const v=i.value.trim();if(!v){$('dBox').classList.remove('shake');void $('dBox').offsetWidth;$('dBox').classList.add('shake');return}close(v)};
  no.onclick=()=>close(null);i.onkeydown=e=>{if(e.key==='Enter')ok.click()};
})}

/* menu: category, folder, upload */
plus.onclick=()=>{menu.classList.add('show');plus.classList.add('open')};
function closeMenu(){menu.classList.remove('show');plus.classList.remove('open')}
menu.onclick=e=>{if(e.target===menu)closeMenu()};
menu.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{const a=b.dataset.a;closeMenu();if(a==='up')$('file').click();else mk(a==='fol')});

// Multiple uploads ka logic
$('file').onchange=async function(){
    const files = Array.from(this.files);
    this.value='';
    if(!files.length) return;
    for (let i = 0; i < files.length; i++) {
        await doUpload(files[i], i + 1, files.length);
    }
};

async function getCode(){
  if(!cfg.needCode)return '';
  let c='';try{c=localStorage.getItem('gcode')||''}catch(e){}
  if(!c){c=await ask('Access code','Enter the access code','Continue','password');if(!c)return null;try{localStorage.setItem('gcode',c)}catch(e){}}
  return c;
}
function badCode(){try{localStorage.removeItem('gcode')}catch(e){}toast('Wrong access code. Try again.')}

async function mk(isF){
  if(isF&&!cat){toast('Open a category first, then create a folder inside it.');return}
  const name=await ask(isF?'New folder':'New category',isF?'Folder name':'Category name','Create');if(!name)return;
  const code=await getCode();if(code===null)return;
  plus.classList.add('spin');
  try{
    const r=await fetch(GW+'/folder',{method:'POST',headers:{'Content-Type':'application/json','x-code':code},body:JSON.stringify(isF?{category:cat,folder:name}:{category:name})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){badCode();return}
    if(!r.ok||!j.ok)throw new Error(j.error||'Try again.');
    await wait(1200);await load();go(j.category,j.folder||'');toast((isF?'Folder':'Category')+' created');
  }catch(e){toast('Couldn’t create it. '+(e.message||''))}
  finally{plus.classList.remove('spin')}
}

async function doUpload(f, currentNum = 1, totalNum = 1){
  if(busy)return;
  if(!/^(image|video)\//.test(f.type)){toast('Please choose a valid image or video.');return}
  if(f.size>500*1024*1024){toast('File is over 500 MB. Choose a smaller one.');return}
  const code=await getCode();if(code===null)return;
  busy=true;add.disabled=true;
  const send=$('send'),stage=$('stage'),fill=document.querySelector('.prog .f'),obj=URL.createObjectURL(f);
  const setP=p=>{fill.style.strokeDashoffset=440*(1-p)};
  $('av').style.backgroundImage='url("'+obj+'")';
  stage.className='stage upl';setP(0);
  
  const fileProgress = totalNum > 1 ? ` (${currentNum}/${totalNum})` : '';
  $('status').textContent='Uploading… 0%' + fileProgress;
  $('sub').textContent='To '+(cat?nice(cat):'Main')+(fol?' › '+nice(fol):'');
  send.classList.add('show');
  
  const fileExt = f.name.split('.').pop() || 'jpg'; // Actual extension
  
  const res=await new Promise(ok=>{
    const x=new XMLHttpRequest();
    x.open('POST',GW+'/upload?category='+enc(cat)+'&folder='+enc(fol)+'&ext='+enc(fileExt));
    x.setRequestHeader('Content-Type','application/octet-stream');x.setRequestHeader('x-code',code);
    x.upload.onprogress=e=>{if(e.lengthComputable){const p=e.loaded/e.total;setP(p*.9);$('status').textContent='Uploading… '+Math.round(p*100)+'%' + fileProgress;}};
    x.upload.onload=()=>{setP(.95);$('status').textContent='Saving…' + fileProgress};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}ok({s:x.status,j})};
    x.onerror=()=>ok({s:0,j:{}});
    x.send(f);
  });
  
  const good=res.s>=200&&res.s<300&&res.j.ok;
  if(good){
    setP(1);stage.classList.add('done');$('status').textContent='Added' + fileProgress;$('sub').textContent='Saved to your gallery';
    if(navigator.vibrate)navigator.vibrate([18,40,18]);
    await wait(1300);
  }
  send.classList.remove('show');await wait(400);
  fill.style.strokeDashoffset='';URL.revokeObjectURL(obj);
  if(res.s===401)badCode();
  else if(!good)toast(res.s?'Upload failed. '+(res.j.error||'Try again.'):'Upload failed. Check your connection.');
  else{
    await wait(900);await load();
    toast('Uploaded ' + currentNum + '/' + totalNum);
    if(rail.lastElementChild)rail.lastElementChild.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})
  }
  busy=false;add.disabled=!items.length;
}

fetch(GW+'/config').then(r=>r.json()).then(j=>{cfg=j}).catch(()=>{});

passIn.onkeydown=e=>{if(e.key==='Enter')tryUnlock()};

// --- SELECTION & ACTION FUNCTIONS ---
function cancelSelection() {
    isSelectMode = false;
    selectedPaths.clear();
    document.getElementById('action-bar').classList.remove('show');
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
}

async function deleteSinglePath(p) {
    const code = localStorage.getItem('gcode') || '@SyedZul';
    try {
        const r = await fetch(GW+'/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'x-code': code},
            body: JSON.stringify({ paths: [p] })
        });
        if(r.ok) { 
            toast('Deleted successfully'); 
            if(cat === p) { cat = 'Main'; fol = ''; }
            else if(cat + '/' + fol === p) { fol = ''; }
            load(true); 
        }
        else toast('Delete failed');
    } catch(e) { toast('Network error'); }
}

async function deleteSelected() {
    if(selectedPaths.size === 0) return;
    showConfirm('Delete Items', "Are you sure you want to delete " + selectedPaths.size + " item(s)?", async () => {
        const code = localStorage.getItem('gcode') || '@SyedZul';
        try {
            const r = await fetch(GW+'/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'x-code': code},
                body: JSON.stringify({ paths: Array.from(selectedPaths) })
            });
            if(r.ok) { toast('Deleted successfully'); cancelSelection(); load(true); }
            else toast('Delete failed');
        } catch(e) { toast('Network error'); }
    });
}

function shareSelected() {
    if(selectedPaths.size === 0) return;
    document.getElementById('sharePassIn').value = '';
    document.getElementById('sharePop').classList.add('show');
}

document.getElementById('shareBtn').onclick = async () => {
    const pass = document.getElementById('sharePassIn').value.trim();
    const code = localStorage.getItem('gcode') || '@SyedZul';
    document.getElementById('shareBtn').textContent = 'Generating...';
    try {
        const r = await fetch(GW+'/share', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'x-code': code},
            body: JSON.stringify({ paths: Array.from(selectedPaths), password: pass })
        });
        const j = await r.json();
        if(j.ok) {
            const shareLink = window.location.origin + window.location.pathname + '?share=' + j.id;
            navigator.clipboard.writeText(shareLink).then(()=>{ toast('Link Copied!'); }).catch(()=>{ prompt('Copy this link:', shareLink); });
            document.getElementById('sharePop').classList.remove('show');
            cancelSelection();
        } else toast('Failed to create link');
    } catch(e) { toast('Network error'); }
    document.getElementById('shareBtn').textContent = 'Generate Link';
};

// Check if user is opening a Share Link or normal link
const urlParams = new URLSearchParams(window.location.search);
const shareId = urlParams.get('share');

if(shareId) {
    document.getElementById('lock').classList.add('hide');
    const pass = prompt("This link is password protected. Enter password (or leave empty if none):");
    fetch(GW+'/share/'+shareId+'?password='+encodeURIComponent(pass||''))
    .then(r=>r.json())
    .then(d=>{
        if(!d.ok) { alert(d.error || 'Invalid Link'); return; }
        document.querySelector('header').style.display = 'none';
        document.querySelector('footer').style.display = 'none';
        
        let sharedItems = [];
        d.files.forEach(f => {
            sharedItems.push({ 
                name: f.split('/').pop(), 
                url: RAW + f.split('/').map(enc).join('/'), 
                fallback: RAW + f.split('/').map(enc).join('/'), 
                path: f 
            });
        });
        items = sharedItems;
        render();
    }).catch(()=>alert("Connection error. Please try again."));
} else {
    let unlocked=false;
    try{unlocked=localStorage.getItem('gcode')==='@SyedZul'}catch(e){}
    if(unlocked){
      lock.classList.add('hide');
      load(true);
    } else {
      setTimeout(()=>passIn.focus(), 400);
    }
}
</script>
</body>
</html>

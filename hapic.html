<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Haptic Feedback Tester</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --button-bg: #292929;
            --button-active: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .supported {
            background-color: rgba(0, 230, 118, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .unsupported {
            background-color: rgba(255, 82, 82, 0.2);
            color: #ff5252;
            border: 1px solid #ff5252;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-secondary);
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid #333;
            padding: 14px 10px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
            touch-action: manipulation;
        }

        button:active {
            background-color: var(--button-active);
            border-color: var(--accent-color);
            transform: scale(0.98);
        }

        .stop-btn {
            grid-column: span 2;
            background-color: rgba(255, 82, 82, 0.15);
            color: #ff5252;
            border-color: #ff5252;
            font-weight: bold;
            margin-top: 5px;
        }

        .stop-btn:active {
            background-color: rgba(255, 82, 82, 0.3);
        }

        .custom-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input[type="number"], input[type="text"] {
            background-color: #121212;
            border: 1px solid #333;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            width: 50%;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .full-width-btn {
            width: 100%;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Android Haptic Tester</h1>
    <div id="supportStatus" class="status-badge">Checking support...</div>

    <!-- Preset Patterns -->
    <div class="card">
        <h2>System & UI Effects</h2>
        <div class="grid">
            <button onclick="vibrate(10)">Light Click (10ms)</button>
            <button onclick="vibrate(30)">Medium Click (30ms)</button>
            <button onclick="vibrate(75)">Heavy Click (75ms)</button>
            <button onclick="vibrate(200)">Long Press (200ms)</button>
            <button onclick="vibrate([15, 30, 15])">Double Tap</button>
            <button onclick="vibrate([30, 50, 30, 50, 30])">Triple Pulse</button>
        </div>
    </div>

    <!-- Notification Patterns -->
    <div class="card">
        <h2>Notification Patterns</h2>
        <div class="grid">
            <button onclick="vibrate([0, 100, 75, 125])">Success</button>
            <button onclick="vibrate([0, 50, 100, 50, 100, 50])">Warning</button>
            <button onclick="vibrate([0, 50, 100, 50, 100, 50, 100, 150])">Error / Alert</button>
            <button onclick="vibrate([0, 200, 100, 200, 100, 200])">Heartbeat</button>
            <button class="stop-btn" onclick="stopVibration()">CANCEL ALL VIBRATION</button>
        </div>
    </div>

    <!-- Custom Single Duration -->
    <div class="card">
        <h2>Custom Duration</h2>
        <div class="custom-controls">
            <div class="input-group">
                <label for="singleDuration">Duration (ms):</label>
                <input type="number" id="singleDuration" value="100" min="1" max="5000">
            </div>
            <button class="full-width-btn" onclick="vibrateCustomSingle()">Trigger Custom Duration</button>
        </div>
    </div>

    <!-- Custom Pattern Input -->
    <div class="card">
        <h2>Custom Pattern Sequence</h2>
        <div class="custom-controls">
            <div class="input-group">
                <label for="patternInput">Pattern Array:</label>
                <input type="text" id="patternInput" value="100, 100, 200, 100, 300">
            </div>
            <div class="hint">Format: Vibrate, Pause, Vibrate, Pause... (in ms)</div>
            <button class="full-width-btn" onclick="vibrateCustomPattern()">Trigger Custom Pattern</button>
        </div>
    </div>

    <script>
        // Check API Support
        const statusEl = document.getElementById('supportStatus');
        const isSupported = 'vibrate' in navigator;

        if (isSupported) {
            statusEl.textContent = 'Vibration API Supported';
            statusEl.classList.add('supported');
        } else {
            statusEl.textContent = 'Vibration API Not Supported';
            statusEl.classList.add('unsupported');
        }

        // Generic Vibration Trigger
        function vibrate(pattern) {
            if (isSupported) {
                navigator.vibrate(pattern);
            } else {
                alert('Vibration API is not supported on this browser/device.');
            }
        }

        // Stop Vibration
        function stopVibration() {
            if (isSupported) {
                navigator.vibrate(0);
            }
        }

        // Trigger Custom Single Duration
        function vibrateCustomSingle() {
            const duration = parseInt(document.getElementById('singleDuration').value, 10);
            if (!isNaN(duration) && duration > 0) {
                vibrate(duration);
            }
        }

        // Trigger Custom Pattern Sequence
        function vibrateCustomPattern() {
            const inputVal = document.getElementById('patternInput').value;
            const pattern = inputVal.split(',')
                                    .map(item => parseInt(item.trim(), 10))
                                    .filter(item => !isNaN(item));

            if (pattern.length > 0) {
                vibrate(pattern);
            }
        }
    </script>
</body>
</html>
